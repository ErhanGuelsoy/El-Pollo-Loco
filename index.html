<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Pollo Loco</title>
<link rel="icon" type="image/x-icon" href="img/5_background/complete_background.png">
<link rel="stylesheet" href="style.css">

<script src="models/keyboard.class.js"></script>
<script src="models/drawable-object.class.js"></script>
<script src="models/movable-object.class.js"></script>
<script src="models/coins.class.js"></script>
<script src="models/collect_bottle.class.js"></script>
<script src="models/character.class.js"></script>
<script src="models/chicken.class.js"></script>
<script src="models/cloud.class.js"></script>
<script src="models/status-bar.class.js"></script>
<script src="models/background-object.class.js"></script>
<script src="models/level.class.js"></script>
<script src="models/endboss.class.js"></script>
<script src="models/throwable-object.class.js"></script>
<script src="levels/level1.js"></script>
<script src="models/world.class.js"></script>
<script src="js/game_audio.class.js"></script>
<script src="js/game.js"></script>
<script src="models/keyboard-info.js"></script>
</head>

<body onload="init()">

<div id="rotateDeviceOverlay">
<div class="rotate-device-box">
<div class="rotate-phone"><div class="rotate-arrow">↻</div></div>
<h2>Gerät drehen</h2>
<p>Bitte drehe dein Smartphone oder Tablet ins Querformat, um El Pollo Loco zu spielen.</p>
</div>
</div>

<h1>El Pollo Loco</h1>

<div class="audio-control">
<button id="outsideAudioBTN" class="outside-audio-btn">🔊</button>
<span id="audioLabel">Mute</span>
</div>

<div id="gameContainer">

<div class="game-area">

<div id="statusbar-container"></div>

<div id="start_game">
<img src="img/9_intro_outro_screens/start/startscreen_1.png" alt="Startscreen">
</div>

<canvas id="canvas" width="720" height="480"></canvas>

<div id="winScreen" class="end-screen hidden">
<img src="img/You won, you lost/You Win A.png" alt="You won">
<div class="end-buttons">
<button class="control-btn" onclick="restartGame()">↻</button>
<button class="control-btn" onclick="backToMenu()">🏠</button>
</div>
</div>

<div id="loseScreen" class="end-screen hidden">
<img src="img/You won, you lost/You lost.png" alt="You lost">
<div class="end-buttons">
<button class="control-btn" onclick="restartGame()">↻</button>
<button class="control-btn" onclick="backToMenu()">🏠</button>
</div>
</div>

<div id="playOverlay">
<button id="startBTN" class="control-btn">▶</button>
<span id="playLabel">Play</span>
</div>

</div>

<button id="keyboardInfoBTN" class="keyboard-info-btn">🎮 Tastenbelegung</button>

<div id="keyboardInfo" class="keyboard-info hidden">
<div class="keyboard-info-box">

<button id="closeKeyboardInfo" class="close-keyboard-btn">✕</button>

<h2>Tastenbelegung</h2>

<div class="key-row"><div class="key">←</div><span>Nach links bewegen</span></div>
<div class="key-row"><div class="key">→</div><span>Nach rechts bewegen</span></div>
<div class="key-row"><div class="key">↑</div><span>Springen</span></div>
<div class="key-row"><div class="key letter-key">D</div><span>Tabasco werfen</span></div>

</div>
</div>

<div class="legal-buttons">

<button id="imprintBTN" class="legal-btn">⚖ Impressum</button>
<button id="privacyBTN" class="legal-btn">🔒 Datenschutz</button>

</div>

</div>
